<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Papeda</title>
    <link rel="stylesheet" href="/admin/style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Admin Papeda</h2>
        <ul id="admin-nav">
            <li><a href="#" data-target="tab-statistik" class="active">Statistik Pengunjung</a></li>
            <li><a href="#" data-target="tab-menu">Kelola Menu</a></li>
            <li><a href="#" data-target="tab-konten">Kelola Konten</a></li>
        </ul>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="main-content">
        
        <!-- TAB 1: STATISTIK -->
        <section id="tab-statistik" class="tab-section active">
            <h1>Statistik Website</h1>
            <div class="stats-card">
                <h3>Total Pengunjung</h3>
                <div class="angka" id="angka-pengunjung">0</div>
            </div>
            <div class="stats-card">
                <h3>Total Menu Aktif</h3>
                <div class="angka" id="angka-menu">0</div>
            </div>
        </section>

        <!-- TAB 2: KELOLA MENU -->
        <section id="tab-menu" class="tab-section">
            <div class="dashboard-container">
                <h1 id="judul-form">Input Menu Baru</h1>
                <form id="form-tambah-menu">
                    <input type="hidden" id="edit_id"> 
                    <div class="form-group">
                        <label>Kategori Hidangan</label>
                        <select id="kategori" required>
                            <option value="MAIN COURSE">MAIN COURSE</option>
                            <option value="APPETIZER">APPETIZER</option>
                            <option value="DESSERT">DESSERT</option>
                            <option value="BEVERAGE">BEVERAGE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nama Makanan</label>
                        <input type="text" id="nama_makanan" required>
                    </div>
                    <div class="form-group">
                        <label>Harga (Rp)</label>
                        <input type="number" id="harga" required>
                    </div>
                    <div class="form-group">
                        <label>Nama/Link Gambar</label>
                        <input type="text" id="gambar" required>
                    </div>
                    <button type="submit" class="btn-simpan" id="btn-submit">Simpan ke Database</button>
                    <button type="button" class="btn-batal" id="btn-cancel">Batal Edit</button>
                </form>

                <table id="tabel-menu">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Gambar</th>
                            <th>Kategori</th>
                            <th>Nama Makanan</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- TAB 3: KELOLA KONTEN -->
        <section id="tab-konten" class="tab-section">
            <div class="dashboard-container">
                <h1>Kelola Teks Halaman Utama</h1>
                <form id="form-konten">
                    <div class="form-group">
                        <label>Teks Sambutan (Hero Banner)</label>
                        <input type="text" id="teks_hero" value="Memuat...">
                    </div>
                    <div class="form-group">
                        <label>Deskripsi Tentang Kami</label>
                        <textarea id="teks_about" rows="4">Memuat...</textarea>
                    </div>
                    <button type="button" class="btn-simpan">Update Konten</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="/admin/script.js" defer></script>
</body>
</html>
